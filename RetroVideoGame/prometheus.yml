global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:80"]
        labels:
          service: "api"
          instance: "api1"
      - targets: ["api2:80"]
        labels:
          service: "api"
          instance: "api2"

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: "kafka"
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: "emailworker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["emailworker:9100"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
