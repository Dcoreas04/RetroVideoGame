services:
  api:
    build:
      context: ./RetroVideoGame
      dockerfile: Dockerfile
    image: retrogame-container
    environment:
      ASPNETCORE_URLS: http://+:80
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_EMAIL_TOPIC: emails
    expose:
      - "80"
    networks:
      - distributed-systems
    depends_on:
      - kafka

  api2:
    build:
      context: ./RetroVideoGame
      dockerfile: Dockerfile
    image: retrogame-container2
    environment:
      ASPNETCORE_URLS: http://+:80
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_EMAIL_TOPIC: emails
    expose:
      - "80"
    networks:
      - distributed-systems
    depends_on:
      - kafka

  nginx:
    image: nginx:latest
    ports:
      - "8081:80"
    volumes:
      - ./RetroVideoGame/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - api2
    networks:
      - distributed-systems

  # kafka and emailworker Was modified with AI
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    networks:
      - distributed-systems
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    healthcheck:
      test:
        - "CMD-SHELL"
        - "cub kafka-ready -b kafka:9092 1 20"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks:
      - distributed-systems
    ports:
      - "8082:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"   # Inbox
      - "1025:1025"   # smtp
    networks:
      - distributed-systems

  emailworker:
    build:
      context: ./EmailWorker
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_EMAIL_TOPIC: emails
      SMTP_FROM: noreply@retrogame.local
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    networks:
      - distributed-systems

volumes:
  kafka_data:

networks:
  distributed-systems: